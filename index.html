<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a1420" />
<meta name="description" content="FindIt — AI-powered campus lost & found with smart matching, instant alerts, and one-click reunions." />
<title>FindIt — Smart Lost &amp; Found</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#060d16; --bg2:#0a1522; --bg3:#0f1e30;
    --card:#122133cc; --card-solid:#152a40;
    --border:#1e3550; --border-light:#2a4566;
    --text:#eef4fb; --muted:#8ba4be;
    --accent:#f5c76e; --accent-dim:#f5c76e33;
    --accent2:#2ec9c3; --accent2-dim:#2ec9c322;
    --danger:#ff6b7a; --danger-dim:#ff6b7a22;
    --success:#4fd18b; --success-dim:#4fd18b22;
    --purple:#a78bfa; --purple-dim:#a78bfa22;
    --radius:14px; --shadow:0 8px 32px #00000055;
    --font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --display:'Space Grotesk','Inter',sans-serif;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  [data-theme="light"]{
    --bg:#f3f7f5; --bg2:#ffffff; --bg3:#e6efec;
    --card:#ffffffdd; --card-solid:#ffffff; --border:#d7e3df; --border-light:#b8cec7;
    --text:#10211f; --muted:#5d716d; --shadow:0 8px 32px #14332a18;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth; scroll-padding-top:calc(72px + var(--safe-top));}
  body{
    margin:0; min-height:100vh; color:var(--text); font-family:var(--font);
    background:var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, #1a3a5c55, transparent),
      radial-gradient(ellipse 60% 40% at 100% 0%, #2ec9c315, transparent),
      radial-gradient(ellipse 50% 30% at 0% 100%, #f5c76e0a, transparent);
  }
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border-light);border-radius:3px;}

  header{
    position:sticky; top:var(--safe-top); z-index:100;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:12px 24px; background:color-mix(in srgb,var(--bg) 90%,transparent); backdrop-filter:blur(16px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:22px; cursor:pointer; user-select:none;}
  .brand-icon{
    width:36px; height:36px; border-radius:10px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow:0 4px 12px #2ec9c344;
  }
  .brand span.dot{color:var(--accent);}
  nav{display:flex; gap:4px; flex-wrap:wrap;}
  nav button{
    background:transparent; border:1px solid transparent; color:var(--muted);
    padding:8px 14px; border-radius:10px; font-size:13px; cursor:pointer; font-weight:600;
    transition:all .2s; font-family:inherit; position:relative;
  }
  nav button.active{background:var(--accent2-dim); color:var(--accent2); border-color:#2ec9c344;}
  nav button:hover:not(.active){color:var(--text); background:#ffffff08;}
  .nav-badge{
    position:absolute; top:-4px; right:-4px; background:var(--accent); color:#231703;
    border-radius:10px; padding:1px 6px; font-size:10px; font-weight:800; min-width:18px; text-align:center;
    animation:pulse 2s infinite;
  }
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.1);}}
  .header-actions{display:flex; gap:8px; align-items:center;}
  .icon-btn{
    width:38px; height:38px; border-radius:10px; border:1px solid var(--border);
    background:transparent; color:var(--muted); cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center; transition:.2s;
  }
  .icon-btn:hover{border-color:var(--accent2); color:var(--accent2);}

  main{max-width:1140px; margin:0 auto; padding:28px 24px calc(80px + var(--safe-bottom));}
  h1{font-family:var(--display); font-size:clamp(26px,4vw,34px); margin:0 0 6px; letter-spacing:-.02em;}
  p.sub{color:var(--muted); margin:0 0 24px; line-height:1.55; max-width:640px;}

  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:28px;}
  .stat{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:16px 18px; transition:transform .2s,border-color .2s;
  }
  .stat:hover{transform:translateY(-2px); border-color:var(--border-light);}
  .stat b{display:block; font-family:var(--display); font-size:28px; line-height:1.1;}
  .stat span{color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-weight:600;}
  .stat.accent b{color:var(--accent2);}
  .stat.success b{color:var(--success);}
  .stat.danger b{color:var(--danger);}

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
  @media(max-width:760px){.grid{grid-template-columns:1fr;}}
  .panel{
    background:var(--card); border:1px solid var(--border); border-radius:18px;
    padding:22px; backdrop-filter:blur(8px);
  }
  .panel h3{margin:0 0 16px; font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px;}

  /* Hero */
  .hero{
    text-align:left; padding:32px; position:relative; overflow:hidden;
    border-radius:24px; border:1px solid var(--border); margin-bottom:28px;
    background:linear-gradient(180deg,#12213388,#0a152244);
  }
  [data-theme="light"] .hero{background:linear-gradient(135deg,#ffffff,#e4f3ee);}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.65fr);gap:28px;align-items:center;position:relative;z-index:1;}
  .hero-proof{background:#07121ddd;border:1px solid #2ec9c344;border-radius:16px;padding:18px;box-shadow:0 16px 40px #00000033;}
  [data-theme="light"] .hero-proof{background:#ffffffcc;box-shadow:0 16px 40px #14332a18;}
  .proof-label{color:var(--accent2);font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;}
  .proof-score{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 4px;}
  .proof-score strong{font:700 38px var(--display);color:var(--accent);}
  .proof-items{display:grid;grid-template-columns:1fr auto 1fr;gap:7px;align-items:center;margin-top:14px;}
  .proof-item{background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:9px;min-width:0;}
  .proof-item b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proof-item span{display:block;color:var(--muted);font-size:10px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .proof-arrow{color:var(--accent2);font-size:18px;}
  .hero::before{
    content:''; position:absolute; inset:0;
    background:radial-gradient(circle at 50% 0%,#2ec9c318,transparent 60%);
    pointer-events:none;
  }
  .hero-badge{
    display:inline-flex; align-items:center; gap:6px; padding:6px 14px;
    border-radius:20px; background:var(--accent2-dim); border:1px solid #2ec9c344;
    color:var(--accent2); font-size:12px; font-weight:700; margin-bottom:16px;
  }
  .hero h1{font-size:clamp(32px,5vw,52px); margin-bottom:12px;max-width:650px;}
  .hero p.sub{margin:0 0 22px; font-size:16px;max-width:620px;}
  .hero-actions{display:flex; gap:12px; justify-content:flex-start; flex-wrap:wrap;}
  .hero-metrics{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;}
  .hero-metrics b{color:var(--text);font:700 18px var(--display);margin-right:4px;}
  .btn-primary,.btn-secondary,.btn-ghost{
    padding:12px 24px; border-radius:12px; font-weight:700; font-size:14px;
    cursor:pointer; border:none; font-family:inherit; transition:all .2s;
  }
  .btn-primary{background:linear-gradient(135deg,var(--accent2),#1fa89f); color:#03211f; box-shadow:0 4px 20px #2ec9c344;}
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 6px 28px #2ec9c355;}
  .btn-secondary{background:var(--accent); color:#231703;}
  .btn-secondary:hover{filter:brightness(1.08); transform:translateY(-2px);}
  .btn-ghost{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-ghost:hover{border-color:var(--accent2); color:var(--accent2);}

  .features{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; margin-bottom:28px;}
  .feature{
    padding:20px; border-radius:var(--radius); border:1px solid var(--border);
    background:var(--card-solid); transition:transform .2s,border-color .2s;
  }
  .feature:hover{transform:translateY(-3px); border-color:var(--border-light);}
  .feature-icon{font-size:28px; margin-bottom:10px;}
  .feature h4{margin:0 0 6px; font-size:15px;}
  .feature p{margin:0; font-size:13px; color:var(--muted); line-height:1.5;}

  .steps{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:28px;}
  .step{flex:1; min-width:180px; text-align:center; padding:20px 16px;}
  .step-num{
    width:36px; height:36px; border-radius:50%; margin:0 auto 10px;
    background:var(--accent2-dim); border:2px solid var(--accent2); color:var(--accent2);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px;
  }
  .step h4{margin:0 0 4px; font-size:14px;}
  .step p{margin:0; font-size:12px; color:var(--muted);}

  .activity-feed{display:flex; flex-direction:column; gap:10px; max-height:320px; overflow-y:auto;}
  .activity-item{
    display:flex; gap:12px; align-items:flex-start; padding:12px;
    background:#0a142066; border-radius:10px; border:1px solid var(--border);
    font-size:13px;
  }
  .activity-dot{width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0;}
  .activity-dot.lost{background:var(--danger);}
  .activity-dot.found{background:var(--success);}
  .activity-dot.match{background:var(--accent);}

  /* AI copilot and map */
  .copilot{display:flex;gap:10px;align-items:flex-start;padding:12px;margin:0 0 16px;background:var(--accent2-dim);border:1px solid #2ec9c344;border-radius:12px;}
  .copilot-icon{font-size:20px;line-height:1;}
  .copilot p{margin:0;color:var(--muted);font-size:12px;line-height:1.45;flex:1;}
  .copilot button{white-space:nowrap;padding:8px 11px;border-radius:9px;border:1px solid #2ec9c366;background:transparent;color:var(--accent2);font-weight:800;cursor:pointer;font-family:inherit;}
  .copilot button:hover{background:var(--accent2-dim);}
  .voice-btn{width:42px!important;padding:0!important;font-size:17px;height:42px;}
  #campusMap{height:520px;border-radius:14px;border:1px solid var(--border);overflow:hidden;z-index:1;}
  .map-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:12px;}
  .map-legend span{display:inline-flex;align-items:center;gap:5px;}
  .map-dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .map-dot.lost{background:var(--danger);}.map-dot.found{background:var(--success);}

  /* Form */
  .toggle{display:flex; background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:4px; margin-bottom:18px;}
  .toggle button{flex:1; background:transparent; border:none; color:var(--muted); padding:11px; border-radius:9px; font-weight:700; cursor:pointer; font-family:inherit; transition:.2s;}
  .toggle button.on.lost{background:var(--danger); color:#fff;}
  .toggle button.on.found{background:var(--success); color:#04241a;}
  label{display:block; font-size:12px; color:var(--muted); margin:14px 0 6px; font-weight:600;}
  input,textarea,select{
    width:100%; background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; border-radius:10px; font-size:14px; font-family:inherit; transition:border-color .2s;
  }
  textarea{resize:vertical; min-height:80px;}
  input:focus,textarea:focus,select:focus{outline:none; border-color:var(--accent2); box-shadow:0 0 0 3px var(--accent2-dim);}
  .form-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:520px){.form-row{grid-template-columns:1fr;}}
  .checkbox-row{display:flex; align-items:center; gap:10px; margin-top:14px;}
  .checkbox-row input{width:auto;}
  .checkbox-row label{margin:0; cursor:pointer;}
  .filerow{display:flex; align-items:center; gap:12px;}
  .thumb{width:56px; height:56px; border-radius:10px; object-fit:cover; border:1px solid var(--border); display:none;}
  .submitbtn{
    margin-top:20px; width:100%; padding:14px; border:none; border-radius:12px;
    background:linear-gradient(135deg,var(--accent),#e8a830); color:#231703;
    font-weight:800; font-size:15px; cursor:pointer; font-family:inherit; transition:.2s;
  }
  .submitbtn:hover{transform:translateY(-1px); filter:brightness(1.06);}

  /* Cards */
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px; align-items:center;}
  .toolbar input,.toolbar select{flex:1; min-width:160px;}
  .cardlist{display:flex; flex-direction:column; gap:12px; max-height:65vh; overflow-y:auto;}
  .item{
    background:var(--card-solid); border:1px solid var(--border); border-radius:14px;
    padding:14px; display:flex; gap:14px; cursor:pointer; transition:all .2s; position:relative;
  }
  .item:hover{border-color:var(--border-light); transform:translateX(3px); box-shadow:var(--shadow);}
  .item.urgent{border-color:#ff6b7a55;}
  .item.urgent::after{
    content:'URGENT'; position:absolute; top:8px; right:8px;
    font-size:9px; font-weight:800; color:var(--danger); background:var(--danger-dim);
    padding:2px 6px; border-radius:4px; letter-spacing:.05em;
  }
  .item img{width:60px; height:60px; border-radius:10px; object-fit:cover; flex-shrink:0;}
  .item .ph{
    width:60px; height:60px; border-radius:10px; background:var(--bg);
    display:flex; align-items:center; justify-content:center; font-size:26px; flex-shrink:0;
    border:1px solid var(--border);
  }
  .item .body{flex:1; min-width:0;}
  .item h4{margin:0 0 4px; font-size:15px; font-weight:700;}
  .item p{margin:0; font-size:13px; color:var(--muted); line-height:1.45;
    display:-webkit-box; line-clamp:2; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .tags{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap;}
  .tag{font-size:11px; padding:3px 9px; border-radius:20px; background:var(--bg); border:1px solid var(--border); color:var(--muted); font-weight:500;}
  .tag.lost-type{color:var(--danger); border-color:#ff6b7a44; background:var(--danger-dim);}
  .tag.found-type{color:var(--success); border-color:#4fd18b44; background:var(--success-dim);}
  .item-actions{display:flex; flex-direction:column; gap:4px; align-self:flex-start;}
  .del,.share-btn{
    background:none; border:none; cursor:pointer; font-size:16px; padding:4px 6px;
    border-radius:6px; transition:.15s;
  }
  .del{color:var(--danger);}
  .del:hover{background:var(--danger-dim);}
  .share-btn{color:var(--accent2);}
  .share-btn:hover{background:var(--accent2-dim);}
  .empty{color:var(--muted); text-align:center; padding:40px 16px; font-size:14px;}
  .empty-icon{font-size:40px; margin-bottom:10px; opacity:.5;}

  /* Matches */
  .matchcard{
    background:var(--card-solid); border:1px solid var(--border); border-radius:18px;
    padding:20px; margin-bottom:16px; transition:border-color .2s;
  }
  .matchcard:hover{border-color:var(--accent2);}
  .matchtop{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .score{font-weight:800; font-size:18px; color:var(--accent); font-family:var(--display);}
  .bar{height:8px; border-radius:4px; background:var(--bg); overflow:hidden; margin-bottom:16px;}
  .bar > div{height:100%; background:linear-gradient(90deg,var(--accent2),var(--accent)); border-radius:4px; transition:width .6s ease;}
  .reasons{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .reason{font-size:11px; padding:4px 10px; border-radius:20px; background:var(--purple-dim); color:var(--purple); font-weight:600;}
  .pair{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:center;}
  @media(max-width:640px){.pair{grid-template-columns:1fr;}}
  .versus{color:var(--muted); font-weight:700; text-align:center; font-size:20px;}
  .miniitem{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px;}
  .miniitem h5{margin:0 0 6px; font-size:14px;}
  .miniitem p{margin:0 0 4px; font-size:12px; color:var(--muted);}
  .actions{display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;}
  .btn{flex:1; min-width:120px; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--muted); font-weight:700; cursor:pointer; font-size:13px; font-family:inherit; transition:.2s;}
  .btn.confirm{background:var(--success); color:#04241a; border-color:var(--success);}
  .btn.confirm:hover{filter:brightness(1.1);}
  .btn.contact{background:var(--accent2-dim); color:var(--accent2); border-color:#2ec9c344;}
  .btn.contact:hover{background:#2ec9c333;}
  .btn.dismiss:hover{border-color:var(--danger); color:var(--danger);}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:#000000aa; backdrop-filter:blur(4px);
    z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .25s;
  }
  .overlay.open{opacity:1; pointer-events:auto;}
  .modal{
    background:var(--bg2); border:1px solid var(--border); border-radius:20px;
    max-width:520px; width:100%; max-height:85vh; overflow-y:auto;
    transform:translateY(20px) scale(.97); transition:transform .25s; padding:24px;
  }
  .overlay.open .modal{transform:translateY(0) scale(1);}
  .modal-header{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px;}
  .modal-close{background:none; border:none; color:var(--muted); font-size:24px; cursor:pointer; line-height:1;}
  .modal-close:hover{color:var(--text);}
  .modal-img{width:100%; max-height:220px; object-fit:cover; border-radius:12px; margin-bottom:16px;}
  .modal-qr{text-align:center; margin-top:16px; padding-top:16px; border-top:1px solid var(--border);}
  .modal-qr canvas{border-radius:8px;}

  /* Toast */
  .toast-container{
    position:fixed; bottom:calc(20px + var(--safe-bottom)); right:20px; z-index:300;
    display:flex; flex-direction:column; gap:8px; pointer-events:none;
  }
  .toast{
    background:var(--card-solid); border:1px solid var(--border); border-radius:12px;
    padding:12px 18px; font-size:13px; font-weight:600; box-shadow:var(--shadow);
    transform:translateX(120%); transition:transform .35s cubic-bezier(.34,1.56,.64,1);
    pointer-events:auto; display:flex; align-items:center; gap:10px; max-width:320px;
  }
  .toast.show{transform:translateX(0);}
  .toast.success{border-color:#4fd18b55;}
  .toast.info{border-color:#2ec9c355;}
  .toast.warn{border-color:#f5c76e55;}

  /* FAB */
  .fab{
    position:fixed; bottom:calc(24px + var(--safe-bottom)); right:24px; z-index:50;
    width:56px; height:56px; border-radius:16px; border:none; cursor:pointer;
    background:linear-gradient(135deg,var(--accent2),#1fa89f); color:#03211f;
    font-size:24px; box-shadow:0 6px 24px #2ec9c355; transition:transform .2s;
    display:none;
  }
  .fab:hover{transform:scale(1.08);}
  @media(max-width:640px){.fab{display:flex; align-items:center; justify-content:center;}}

  /* Settings */
  .settings-grid{display:flex; flex-direction:column; gap:14px;}
  .status-pill{
    display:inline-flex; align-items:center; gap:6px; padding:5px 12px;
    border-radius:20px; font-size:12px; font-weight:700;
  }
  .status-pill.live{background:var(--success-dim); color:var(--success);}
  .status-pill.local{background:var(--accent-dim); color:var(--accent);}
  .status-pill.offline{background:var(--danger-dim); color:var(--danger);}

  /* Confetti */
  .confetti{position:fixed; inset:0; pointer-events:none; z-index:400; overflow:hidden;}
  .confetti-piece{
    position:absolute; width:10px; height:10px; top:-10px;
    animation:confetti-fall linear forwards;
  }
  @keyframes confetti-fall{to{transform:translateY(110vh) rotate(720deg);opacity:0;}}

  /* Chart */
  .chart{display:flex; align-items:flex-end; gap:8px; height:100px; padding-top:10px;}

const DISMISS_KEY = 'findit_dismissed_v2';

const CATS = ['Electronics','ID Card','Bag','Wallet','Keys','Clothing','Books','Other'];

const SYNONYMS = {

  glasses:['specs','spectacles'], specs:['glasses'], wallet:['purse'], purse:['wallet'],

function loadDismiss(){ try{return JSON.parse(localStorage.getItem(DISMISS_KEY))||[];}catch(e){return[];} }
function saveDismiss(d){ localStorage.setItem(DISMISS_KEY, JSON.stringify(d)); }
function loadLocal(key){ try{return JSON.parse(localStorage.getItem(key))||[];}catch(e){return[];} }
function saveLocal(key,val){ localStorage.setItem(key, JSON.stringify(val)); }

function applyTheme(){
  document.documentElement.dataset.theme=theme;
  document.getElementById('themeBtn').textContent=theme==='dark'?'☼':'◐';
  document.querySelector('meta[name="theme-color"]').setAttribute('content',theme==='dark'?'#060d16':'#f3f7f5');
}

function toast(msg, type='info'){
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type==='success'?'✅':type==='warn'?'⚠️':'ℹ️'}</span><span>${msg}</span>`;
  toasts.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),350); }, 3200);
}

function timeAgo(iso){
  if(!iso) return '';
  const diff = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diff/60000);
  if(mins<1) return 'just now';
  if(mins<60) return `${mins}m ago`;
  const hrs = Math.floor(mins/60);
  if(hrs<24) return `${hrs}h ago`;
  const days = Math.floor(hrs/24);
  if(days<7) return `${days}d ago`;
  return new Date(iso).toLocaleDateString();
}

function avgColor(dataUrl, cb){
  const img = new Image();
  img.onload = ()=>{
    const c = document.createElement('canvas'); c.width=8; c.height=8;
    const ctx = c.getContext('2d'); ctx.drawImage(img,0,0,8,8);
    const d = ctx.getImageData(0,0,8,8).data;
    let r=0,g=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];n++;}
    cb([r/n,g/n,b/n]);
  };
  img.src = dataUrl;
}

function fileToBase64(file, cb){
  const reader = new FileReader();
  reader.onload = ()=>cb(reader.result);
  reader.readAsDataURL(file);
}

function copilotDraft(text){
  const raw=text.trim();
  const lower=raw.toLowerCase();
  const type=/\b(found|picked up|saw|discovered|handed)\b/.test(lower)?'found':'lost';
  const category=['Bag','Wallet','Keys','ID Card','Electronics','Clothing','Books'].find(c=>{
    const terms={Electronics:'phone|laptop|earbud|charger|watch', 'ID Card':'id|student card|identity', Bag:'bag|backpack|satchel', Wallet:'wallet|purse', Keys:'key|keychain', Clothing:'jacket|shirt|hoodie|clothes', Books:'book|notebook'}[c];
    return terms&&new RegExp(`\\b(${terms})\\b`).test(lower);
  })||'Other';
  const zone=ZONES.slice(1).find(z=>lower.includes(z.toLowerCase()))||'';
  const cleaned=raw.replace(/\b(i|my|a|an|the|lost|found|near|at|in|around)\b/gi,' ').replace(/\s+/g,' ').trim();
  const titleWords=cleaned.split(/[,.!?]/)[0].trim().split(' ').slice(0,6).join(' ');
  const title=titleWords?titleWords.charAt(0).toUpperCase()+titleWords.slice(1):`${type==='lost'?'Lost':'Found'} ${category}`;
  return {type,category,zone,title,description:raw};
}

function startVoiceInput(){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){ toast('Voice input is not supported in this browser','warn'); return; }
  const recognition=new SpeechRecognition(); recognition.lang='en-IN'; recognition.interimResults=false;
  recognition.onstart=()=>toast('Listening... describe the item and location','info');
  recognition.onresult=e=>{ document.getElementById('copilotInput').value=e.results[0][0].transcript; document.getElementById('aiGenerate').click(); };
  recognition.onerror=()=>toast('Voice input stopped. Try typing instead.','warn'); recognition.start();
}

function seedData(){
  const today = new Date(), d0 = today.toISOString().slice(0,10);
  const d1 = new Date(today - 86400000).toISOString().slice(0,10);

  return [

    {id:'s3',type:'lost',title:'College ID Card',category:'ID Card',location:'Cafeteria',date:d1,desc:'Lost my student ID card, has my photo and roll number.',image:null,color:null,status:'open',urgent:false,reporterName:'Meera Iyer',reporterPhone:'9876533333',createdAt:d1},
    {id:'s4',type:'found',title:'Student ID found',category:'ID Card',location:'Cafeteria area',date:d0,desc:'Picked up a college ID card near the cafeteria tables.',image:null,color:null,status:'open',urgent:false,reporterName:'Arjun Nair',reporterPhone:'9876544444',createdAt:now},
    {id:'s5',type:'lost',title:'Steel Water Bottle',category:'Other',location:'Sports Complex',date:d0,desc:'Green steel water bottle, dented on one side.',image:null,color:null,status:'open',urgent:false,reporterName:'Kavya Menon',reporterPhone:'9876555555',createdAt:now},
    {id:'s6',type:'found',title:'Wireless Earbuds case',category:'Electronics',location:'Auditorium',date:d0,desc:'White AirPods-style case found on seat row 5.',image:null,color:null,status:'open',urgent:false,reporterName:'Rohan Das',reporterPhone:'9876566666',createdAt:now},
  ];

function dbRowToReport(r){
  return {
    id:r.id, type:r.type, title:r.title, category:r.category, location:r.location,
    date:r.date, desc:r.description||r.desc||'', image:r.image, color:r.color,
    status:r.status||'open', urgent:!!r.urgent,
    reporterName:r.reporter_name||r.reporterName||'',
    reporterPhone:r.reporter_phone||r.reporterPhone||'',
    createdAt:r.created_at||r.createdAt||new Date().toISOString()
  };
}

function reportToDbRow(r){
  return {
    id:r.id, type:r.type, title:r.title, category:r.category, location:r.location,
    date:r.date, description:r.desc, image:r.image, color:r.color, status:r.status,
    urgent:!!r.urgent, reporter_name:r.reporterName, reporter_phone:r.reporterPhone,
    created_at:r.createdAt||new Date().toISOString()
  };
}

async function insertReportDB(r){
  if(usingDB && supabaseClient){
    await supabaseClient.from('reports').upsert(reportToDbRow(r));
  } else saveLocal(LS_REPORTS, reports);
}

async function updateReportDB(id, patch){
  if(usingDB && supabaseClient){
    const dbPatch = {};
    if(patch.status) dbPatch.status = patch.status;
    if(patch.urgent !== undefined) dbPatch.urgent = patch.urgent;
    await supabaseClient.from('reports').update(dbPatch).eq('id', id);
  } else saveLocal(LS_REPORTS, reports);
}

async function deleteReportDB(id){
  if(usingDB && supabaseClient) await supabaseClient.from('reports').delete().eq('id', id);
  else saveLocal(LS_REPORTS, reports);
}

async function insertHistoryDB(entry){
  if(usingDB && supabaseClient){
    const {data}=await supabaseClient.from('match_history').insert({
      lost_id:entry.lostId, found_id:entry.foundId,
      lost_title:entry.lostTitle, found_title:entry.foundTitle, score:entry.score,
      lost_name:entry.lostName, lost_phone:entry.lostPhone,
      found_name:entry.foundName, found_phone:entry.foundPhone,
      pickup_code:entry.pickupCode, claim_status:entry.claimStatus, claimed_at:entry.claimedAt,
      at:entry.at
    }).select('id').single();
    if(data) entry.dbId=data.id;
  } else saveLocal(LS_HISTORY, history);
}

async function updateHistoryDB(entry){
  if(usingDB && supabaseClient && entry.dbId){
    await supabaseClient.from('match_history').update({
      claim_status:entry.claimStatus, claimed_at:entry.claimedAt
    }).eq('id', entry.dbId);
  } else saveLocal(LS_HISTORY, history);
}

async function fetchAllData(){
  if(usingDB && supabaseClient){
    const [repRes, histRes] = await Promise.all([
      supabaseClient.from('reports').select('*').order('created_at',{ascending:false}),
      supabaseClient.from('match_history').select('*').order('at',{ascending:false})
    ]);
    if(repRes.error) throw repRes.error;
    reports = (repRes.data||[]).map(dbRowToReport);
    history = (histRes.data||[]).map(h=>({
      dbId:h.id, lostId:h.lost_id, foundId:h.found_id,
      lostTitle:h.lost_title, foundTitle:h.found_title, score:h.score, at:h.at,
      lostName:h.lost_name, lostPhone:h.lost_phone, foundName:h.found_name, foundPhone:h.found_phone,
      pickupCode:h.pickup_code, claimStatus:h.claim_status||'pending', claimedAt:h.claimed_at
    }));
    if(reports.length===0 && !seedChecked){
      seedChecked=true;
      for(const r of seedData()) await insertReportDB(r);
      reports = seedData();
    }
  } else {
    reports = loadLocal(LS_REPORTS);
    if(reports.length===0){ reports=seedData(); saveLocal(LS_REPORTS,reports); }
    history = loadLocal(LS_HISTORY);
  }
}

function subscribeRealtime(){
  if(!usingDB || !supabaseClient) return;
  supabaseClient.channel('findit-live')
    .on('postgres_changes',{event:'*',schema:'public',table:'reports'},()=>{ fetchAllData().then(render); })
    .on('postgres_changes',{event:'*',schema:'public',table:'match_history'},()=>{ fetchAllData().then(render); })
    .subscribe();
}

async function initData(){
  try{
    if(CONFIG.supabaseUrl && CONFIG.supabaseKey && window.supabase){
      supabaseClient = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey);
      usingDB = true; dbMode = 'supabase';
      await fetchAllData();
      subscribeRealtime();
      toast('Connected to live database','success');
    } else {
      try{
        const dbApi = (window.claude && typeof window.claude.use==='function') ? await window.claude.use('db') : null;
        if(dbApi){
          usingDB = true; dbMode = 'claude';
          dbApi.collection('reports').onSnapshot(snap=>{
            reports = snap.docs.map(d=>({id:d.id,...d.data()}));
            if(reports.length===0 && !seedChecked){
              seedChecked=true;
              seedData().forEach(r=>dbApi.collection('reports').doc(r.id).set(r));
            }
            render();
          });
          dbApi.collection('history').orderBy('at','desc').onSnapshot(snap=>{
            history = snap.docs.map(d=>d.data());
            render();
          });
        }
      }catch(e){}
    }
    if(!usingDB){
      reports = loadLocal(LS_REPORTS);
      if(reports.length===0){ reports=seedData(); saveLocal(LS_REPORTS,reports); }
      history = loadLocal(LS_HISTORY);
    }
  }catch(e){
    usingDB = false; dbMode = 'local';
    reports = loadLocal(LS_REPORTS);
    if(reports.length===0){ reports=seedData(); saveLocal(LS_REPORTS,reports); }
    history = loadLocal(LS_HISTORY);
    toast('Using offline mode','warn');
  }
  render();
}

function getStats(){
  const lost = reports.filter(r=>r.type==='lost'&&r.status==='open').length;
  const found = reports.filter(r=>r.type==='found'&&r.status==='open').length;
  const resolved = history.length;
  const matchCount = computeMatches().length;
  const rate = reports.length ? Math.round((resolved*2/reports.length)*100) : 0;
  return {lost, found, resolved, matchCount, rate};
}

function statsHtml(){
  const s = getStats();
  return `<div class="stats">
    <div class="stat danger"><b>${s.lost}</b><span>Active Lost</span></div>
    <div class="stat success"><b>${s.found}</b><span>Active Found</span></div>
    <div class="stat accent"><b>${s.matchCount}</b><span>Smart Matches</span></div>
    <div class="stat"><b>${s.resolved}</b><span>Reunited</span></div>
  </div>`;
}

function scoreWithReasons(lost, found){
  let s = 0;
  const reasons = [];
  if(lost.category===found.category){ s+=30; reasons.push(`Same category (${lost.category})`); }
  const l1=lost.location.toLowerCase(), l2=found.location.toLowerCase();
  if(l1&&l2&&(l1.includes(l2)||l2.includes(l1))){ s+=15; reasons.push('Nearby location'); }
  const days=Math.abs(new Date(lost.date)-new Date(found.date))/86400000;
  if(days<=1){ s+=20; reasons.push('Same day'); }
  else if(days<=3){ s+=12; reasons.push('Within 3 days'); }
  else if(days<=7){ s+=4; reasons.push('Same week'); }
  const words=t=>{
    const raw=t.toLowerCase().split(/\W+/).filter(w=>w.length>2);
    const exp=new Set();
    raw.forEach(w=>{exp.add(w);(SYNONYMS[w]||[]).forEach(x=>exp.add(x));});
    return exp;
  };
  const w1=words(lost.title+' '+lost.desc), w2=words(found.title+' '+found.desc);
  let overlap=0; w1.forEach(w=>{if(w2.has(w)) overlap++;});
  if(overlap>0){ s+=Math.min(overlap*3,20); reasons.push(`${overlap} keyword${overlap>1?'s':''} match`); }
  if(lost.color&&found.color){
    const dist=Math.sqrt(lost.color.reduce((a,c,i)=>a+(c-found.color[i])**2,0));
    if(dist<40){ s+=15; reasons.push('Similar color'); }
    else if(dist<80){ s+=8; reasons.push('Close color tone'); }
  }
  return {score:Math.min(s,100), reasons};
}

function computeMatches(){
  const lost=reports.filter(r=>r.type==='lost'&&r.status==='open');
  const found=reports.filter(r=>r.type==='found'&&r.status==='open');
  let pairs=[];
  lost.forEach(l=>found.forEach(f=>{
    const key=l.id+'::'+f.id;
    if(dismissed.includes(key)) return;
    const {score,reasons}=scoreWithReasons(l,f);
    if(score>=35) pairs.push({l,f,sc:score,reasons,key});
  }));
  pairs.sort((a,b)=>b.sc-a.sc);
  return pairs;
}

function categoryChart(){
  const counts={};
  CATS.forEach(c=>counts[c]=0);
  reports.filter(r=>r.status==='open').forEach(r=>{ if(counts[r.category]!==undefined) counts[r.category]++; });
  const max=Math.max(...Object.values(counts),1);
  return `<div class="chart">${CATS.map(c=>{
    const h=Math.round((counts[c]/max)*80)+4;
    return `<div class="chart-bar" style="height:${h}px"><span class="val">${counts[c]}</span><span>${CATS.indexOf(c)<4?c.slice(0,3):c.slice(0,4)}</span></div>`;
  }).join('')}</div>`;
}

function recentActivity(){
  const items=[];
  reports.slice().sort((a,b)=>new Date(b.createdAt||b.date)-new Date(a.createdAt||a.date)).slice(0,5)
    .forEach(r=>items.push({type:r.type, text:`<b>${r.title}</b> reported ${r.type} at ${r.location}`, time:r.createdAt||r.date}));
  history.slice(0,3).forEach(h=>items.push({type:'match', text:`Match confirmed: <b>${h.lostTitle}</b> ↔ <b>${h.foundTitle}</b>`, time:h.at}));
  items.sort((a,b)=>new Date(b.time)-new Date(a.time));
  if(!items.length) return '<div class="empty">No activity yet — be the first to report!</div>';
  return items.slice(0,6).map(a=>`
    <div class="activity-item">
      <div class="activity-dot ${a.type}"></div>
      <div><div>${a.text}</div><div style="color:var(--muted);font-size:11px;margin-top:3px;">${timeAgo(a.time)}</div></div>
    </div>`).join('');
}

function renderNav(){
  const count=computeMatches().length;
  const tabs=[['home','Home'],['report','Report'],['browse','Browse'],['map','Map'],['matches','Matches'],['history','History']];
  nav.innerHTML=tabs.map(([t,label])=>{

function drawQR(canvas, text){
  if(!canvas) return;
  const size=140, ctx=canvas.getContext('2d');
  canvas.width=size; canvas.height=size;
  const modules=21, cell=size/modules;
  const pattern=hashToGrid(text, modules);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#0a1420';
  for(let y=0;y<modules;y++) for(let x=0;x<modules;x++)
    if(pattern[y][x]||isFinder(x,y,modules)) ctx.fillRect(x*cell,y*cell,cell,cell);
}

function hashToGrid(str,n){
  let h=0; for(let i=0;i<str.length;i++) h=((h<<5)-h+str.charCodeAt(i))|0;
  const g=Array.from({length:n},()=>Array(n).fill(false));
  for(let y=0;y<n;y++) for(let x=0;x<n;x++){
    if(isFinder(x,y,n)) continue;
    h=((h*1103515245+12345)|0)>>>0;
    g[y][x]=(h&1)===1;
  }
  return g;
}

function isFinder(x,y,n){
  const inTL=x<7&&y<7, inTR=x>=n-7&&y<7, inBL=x<7&&y>=n-7;
  if(!inTL&&!inTR&&!inBL) return false;
  const lx=inTR?x-(n-7):x, ly=inBL?y-(n-7):y;
  return lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4);
}

function shareReport(id){
  const r=reports.find(x=>x.id===id);
  if(!r) return;
  const text=`FindIt: ${r.type==='lost'?'Lost':'Found'} — ${r.title} at ${r.location}. ${r.desc.slice(0,80)}`;
  if(navigator.share) navigator.share({title:'FindIt Report',text,url:location.href}).catch(()=>{});
  else{ navigator.clipboard?.writeText(text); toast('Copied to clipboard!','success'); }
}

function sortReports(list){
  const copy=[...list];
  if(browseSort==='newest') copy.sort((a,b)=>new Date(b.createdAt||b.date)-new Date(a.createdAt||a.date));
  else if(browseSort==='oldest') copy.sort((a,b)=>new Date(a.createdAt||a.date)-new Date(b.createdAt||b.date));
  else if(browseSort==='urgent') copy.sort((a,b)=>(b.urgent?1:0)-(a.urgent?1:0));
  return copy;
}

  main.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{
    const entry=history[Number(b.dataset.claim)];
    openModal(`<div class="modal-header"><h3 style="margin:0;font-family:var(--display);">Verify pickup</h3><button class="modal-close">×</button></div><p style="color:var(--muted);line-height:1.5;">Ask the owner or finder for the six-digit code shown when this match was confirmed.</p><label>Pickup code</label><input id="pickupInput" inputmode="numeric" maxlength="6" placeholder="123456" /><button class="btn-primary" id="verifyPickup" style="width:100%;margin-top:16px;">Mark as picked up</button>`);
    document.getElementById('verifyPickup').onclick=async()=>{
      const input=document.getElementById('pickupInput').value.trim();
      if(input!==entry.pickupCode){ toast('That pickup code does not match','warn'); return; }
      entry.claimStatus='picked_up'; entry.claimedAt=new Date().toISOString();
      await updateHistoryDB(entry); closeModal(); toast('Pickup verified. Item reunited!','success'); render();
    };
  });
}

function renderSettings(){
  openModal(`
    <div class="modal-header"><h3 style="margin:0;font-family:var(--display);">⚙️ Settings</h3><button class="modal-close">×</button></div>
    <div class="settings-grid">
      <div>
        <label>Supabase URL (for live demo)</label>
        <input id="cfgUrl" value="${CONFIG.supabaseUrl}" placeholder="https://xxxx.supabase.co" />
      </div>
      <div>
        <label>Supabase Anon Key</label>
        <input id="cfgKey" value="${CONFIG.supabaseKey}" placeholder="eyJ..." />
      </div>
      <p style="font-size:12px;color:var(--muted);margin:0;">Run <code>supabase-setup.sql</code> in your Supabase SQL editor first, then paste credentials here and reload.</p>
      <button class="btn-primary" id="saveCfg" style="width:100%;">Save &amp; Reload</button>
      <button class="btn-ghost" id="resetData" style="width:100%;">Reset to Demo Data</button>
    </div>`);
  document.getElementById('saveCfg').onclick=()=>{
    CONFIG.supabaseUrl=document.getElementById('cfgUrl').value.trim();
    CONFIG.supabaseKey=document.getElementById('cfgKey').value.trim();
    localStorage.setItem('findit_config',JSON.stringify(CONFIG));
    location.reload();
  };
  document.getElementById('resetData').onclick=()=>{
    if(!confirm('Reset all data to demo seed?')) return;
    reports=seedData(); history=[]; dismissed=[];
    saveLocal(LS_REPORTS,reports); saveLocal(LS_HISTORY,[]); saveDismiss([]);
    toast('Reset to demo data','info'); closeModal(); render();
  };
}

function render(){
  renderNav();
  if(tab==='home') renderHome();
  else if(tab==='report') renderReport();
  else if(tab==='browse') renderBrowse();
  else if(tab==='map') renderMap();
  else if(tab==='matches') renderMatches();
  else renderHistory();
}

document.getElementById('brandHome').onclick=()=>{tab='home';render();};
document.getElementById('fab').onclick=()=>{tab='report';render();};
document.getElementById('themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('findit_theme',theme);applyTheme();};
document.getElementById('settingsBtn').onclick=renderSettings;

const savedCfg=localStorage.getItem('findit_config');
if(savedCfg) Object.assign(CONFIG,JSON.parse(savedCfg));

const urlItem=new URLSearchParams(location.search).get('item');
applyTheme();
initData().then(()=>{
  if(urlItem){
    const r=reports.find(x=>x.id===urlItem);
    if(r){ tab='browse'; render(); setTimeout(()=>showItemModal(r),300); }
  }
});
</script>
</body>
</html>
